name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your deployed Streamlit URL (e.g. https://my-app.streamlit.app)"
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate URL
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          if [[ ! "$APP_URL" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~/-]*)?$ ]]; then
            echo "app_url must be a plain https:// URL"; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-app
        env:
          APP_URL: ${{ inputs.app_url }}
        run: gradle assembleDebug --no-daemon -PappUrl="$APP_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: ConstructionIntel-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
