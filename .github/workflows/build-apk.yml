name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your deployed Streamlit URL (e.g. https://my-app.streamlit.app)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate URL
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          if [[ ! "$APP_URL" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~/-]*)?$ ]]; then
            echo "app_url must be a plain https:// URL"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-app
        env:
          APP_URL: ${{ inputs.app_url }}
        run: gradle assembleDebug --no-daemon -PappUrl="$APP_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: ConstructionIntel-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
